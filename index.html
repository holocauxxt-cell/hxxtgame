<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080d18"><title>VOIDFALL — Three.js</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d18;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block;position:fixed;inset:0;z-index:0}#ui{position:fixed;inset:0;z-index:2;pointer-events:none;color:#e8f4ff;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.panel{background:linear-gradient(145deg,#101c2de8,#08111de8);border:1px solid #31516c;border-radius:12px;padding:9px 11px;box-shadow:0 5px 24px #0006;backdrop-filter:blur(8px)}.brand{font-weight:900;letter-spacing:.18em;color:#70e9ff;font-size:13px}.small{font-size:11px;color:#9eb6ca}.stats{font-size:12px;line-height:1.6}.bar{height:6px;background:#243448;border-radius:5px;overflow:hidden;margin-top:4px;width:min(40vw,190px)}.bar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#43d8b8,#a1ffda)}#bossHud{display:none;position:absolute;top:88px;left:50%;transform:translateX(-50%);width:min(76vw,360px);text-align:center}#bossHud .bar{width:100%;height:8px}#bossHud i{background:linear-gradient(90deg,#ff4d7a,#ffb15e)}.rightButtons{display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto}.uiBtn{border:1px solid #4a7797;color:#eaf8ff;background:#102238e8;border-radius:10px;padding:10px 12px;font-weight:800;font-size:11px;letter-spacing:.05em;box-shadow:0 4px 14px #0005;touch-action:manipulation}.uiBtn:active{transform:scale(.97);background:#1c3a54}.bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}.bottomInfo{font-size:11px;color:#a9c1d4;max-width:54vw}.weaponChip{display:inline-block;padding:4px 7px;margin:3px 3px 0 0;border-radius:6px;background:#132a3d;border:1px solid #34566f;color:#a8efff;font-size:10px}.weaponChip.active{border-color:#5ce8ff;background:#16465a;color:#fff}.inventory{pointer-events:auto;position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(92vw,430px);max-height:78vh;overflow:auto;display:none;background:#091422f5;border:1px solid #4a7797;border-radius:16px;padding:16px;box-shadow:0 20px 80px #000b}.inventory.open{display:block}.inventory h2{font-size:16px;letter-spacing:.12em;margin:0 0 4px;color:#79eaff}.invGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.item{padding:10px;border:1px solid #29465c;border-radius:10px;background:#102033}.item strong{display:block;font-size:12px;margin-bottom:4px}.item span{font-size:10px;color:#9fb9cd}.item button{margin-top:8px;width:100%;font-size:10px}.hint{color:#91aabd;font-size:11px;line-height:1.5}.modalClose{float:right}.centerMsg{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);text-align:center;font-weight:900;letter-spacing:.12em;text-shadow:0 3px 20px #000;font-size:19px;color:#baf7ff;opacity:0;transition:opacity .2s}.centerMsg.show{opacity:1}.progress{height:5px;border-radius:5px;background:#1c3043;margin-top:5px;overflow:hidden}.progress i{display:block;height:100%;background:#71e9ff;width:0}.crosshair{position:absolute;width:20px;height:20px;border:1px solid #6eeaff80;border-radius:50%;transform:translate(-50%,-50%);display:none}
#joystick{position:fixed;z-index:4;width:116px;height:116px;margin:-58px 0 0 -58px;display:none;pointer-events:none;opacity:.94}#joyBase{position:absolute;inset:0;border:2px solid #8aeaffa8;border-radius:50%;background:radial-gradient(circle,#244b6288,#07142199);box-shadow:0 0 24px #38dfff25,inset 0 0 18px #4edfff20}#joyKnob{position:absolute;width:46px;height:46px;left:35px;top:35px;border-radius:50%;border:2px solid #c4f8ff;background:radial-gradient(circle at 35% 30%,#baf8ff,#36a9c8 65%,#13516e);box-shadow:0 0 18px #52eaff80}
@media(min-width:700px){#ui{padding:16px}.bottom{bottom:16px}.panel{padding:12px 15px}}
</style>
</head>
<body>
<div id="ui">
 <div class="top">
  <div class="panel"><div class="brand">VOIDFALL <span style="color:#d8e8f5;font-weight:500">/ THREE</span></div><div class="stats">HP <b id="hpText">100 / 100</b><div class="bar"><i id="hpBar"></i></div><div style="margin-top:5px">ВОЛНА <b id="wave">1</b> · УРОВЕНЬ <b id="level">1</b></div><div class="progress"><i id="xpBar"></i></div><div class="small" id="scrap">Фрагменты: 0</div></div></div>
  <div class="rightButtons"><button class="uiBtn" id="invBtn">▦ ИНВЕНТАРЬ</button><button class="uiBtn" id="pauseBtn">Ⅱ ПАУЗА</button></div>
 </div>
 <div id="bossHud" class="panel"><div id="bossName" style="font-size:12px;font-weight:900;letter-spacing:.12em">БОСС</div><div class="bar"><i id="bossBar"></i></div></div>
 <div class="centerMsg" id="message"></div><div class="crosshair" id="crosshair"></div>
 <div class="bottom"><div class="panel bottomInfo"><div id="movement">● СТОИШЬ</div><div class="small" id="targetInfo">Найди врагов и двигайся, чтобы уклоняться</div><div id="weaponList"></div></div><div class="rightButtons"><button class="uiBtn" id="swapBtn">ОРУЖИЕ: 1</button></div></div>
 <div class="inventory" id="inventory"><button class="uiBtn modalClose" id="closeInv">ЗАКРЫТЬ ✕</button><h2>СНАРЯЖЕНИЕ</h2><div class="hint">Оружие действует автоматически. Выбирай экипировку и переключай активное оружие.</div><div class="invGrid" id="invItems"></div><h2>ЭКИПИРОВКА</h2><div class="invGrid" id="gearItems"></div><div class="hint" id="invStats"></div></div>
</div>
<div id="joystick"><div id="joyBase"></div><div id="joyKnob"></div></div>
<script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script><script type="module" src="./game.js"></script>
</body></html>
